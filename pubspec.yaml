name: rosenweg_reparatur
description: "Rosenweg Reparatur – Schäden melden mit Foto, eigene Meldungen verfolgen, Meldungen der STWEG ansehen und bearbeiten."
publish_to: 'none'

# version: x.y.z+Baunummer. Ein Merge auf main mit einer NEUEN Version (Tag
# vx.y.z gibt es noch nicht) baut alle Plattformen und veroeffentlicht sie
# (GitHub-Release, /apps). Unveraenderte Version = nur CI, kein Release.
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # nur fuer die Vorfuehrdaten (lib/attrappe.dart): Foto ohne Server
  http: ^1.6.0
  image: ^4.3.0
  # Gemeinsame Basis der Rosenweg-Apps: Anmeldung (Karte, QR, Konto, still per
  # Kerberos), API, Gerüst (Handy/Desktop), Updater, Logo-Baukasten.
  # Oeffentliches Repo: pub holt es ohne Token; lokal mit ../rosenweg-basis
  # ueber pubspec_overrides.yaml (siehe README, "Entwickeln").
  rosenweg_basis:
    git:
      url: https://github.com/Rosenweg/rosenweg-basis.git
      # fester Tag (mit Updater und iOS-MainActor-Fix); neue Basis = neuer Tag
      # bis Tag v0.6.3 steht: Commit des Basis-PR #28 (FotoFeld, BeimOeffnen)
      ref: c122e16f8bd2f8b97612e7b923af317113f3bfd0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Logo fuer Anmeldeschirm, "Über" und Titelleiste (assets/logo/erzeugen.sh)
  assets:
    - assets/logo/rosenweg-reparatur-512.png
    - assets/logo/rosenweg-reparatur-klein.png
